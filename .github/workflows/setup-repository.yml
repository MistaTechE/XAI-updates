name: Setup XAI Updates Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository structure
        run: |
          mkdir -p research
          mkdir -p best-practices
          mkdir -p laws-regulations
          mkdir -p standards
          mkdir -p news
          mkdir -p data

          touch research/.gitkeep
          touch best-practices/.gitkeep
          touch laws-regulations/.gitkeep
          touch standards/.gitkeep
          touch news/.gitkeep
          touch data/.gitkeep

          mkdir -p .github/workflows

      - name: Create initial CSV
        run: |
          if [ ! -f data/xai-updates.csv ]; then
            printf 'date,category,title,source,url,summary,tags\n' > data/xai-updates.csv
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Create XAI updates repository structure"
            git push
          fi
