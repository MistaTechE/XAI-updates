name: XAI Researcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &

          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              break
            fi
            sleep 2
          done

      - name: Pull Qwen
        run: |
          ollama pull qwen3:8b

      - name: Test Qwen
        run: |
          ollama run qwen3:8b "You are an AI research assistant monitoring explainable AI, responsible AI, AI safety, AI ethics, AI governance, AI regulation, and AI research. Respond with exactly one sentence confirming that you are ready to analyze research material."

      - name: Show repository structure
        run: |
          find research best-practices laws-regulations standards news data -maxdepth 2 -type f | sort
